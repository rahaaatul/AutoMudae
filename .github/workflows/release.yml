name: CI and Release

on:
  push:
    branches: [ stable ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.9

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Lint with ruff
        run: uv run ruff check

      - name: Build package
        run: uv build

      - name: Check build artifacts
        run: ls -la dist/

      - name: Cache dist
        uses: actions/cache@v4
        with:
          path: dist/
          key: dist-${{ github.sha }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/

  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/stable'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get package version
        id: version
        run: echo "version=$(grep '^version =' pyproject.toml | sed 's/version = "\(.*\)"/\1/')" >> $GITHUB_OUTPUT

      - name: Check if tag and release already exist
        run: |
          PACKAGE_VERSION="${{ steps.version.outputs.version }}"

          TAG_EXISTS=false
          RELEASE_EXISTS=false

          # Check if tag exists
          if git ls-remote --tags --refs origin "$PACKAGE_VERSION" | grep -q "refs/tags/$PACKAGE_VERSION$"; then
            echo "ℹ Tag $PACKAGE_VERSION already exists"
            TAG_EXISTS=true
          fi

          # Check if release exists
          if gh release view "$PACKAGE_VERSION" >/dev/null 2>&1; then
            echo "ℹ Release $PACKAGE_VERSION already exists"
            RELEASE_EXISTS=true
          fi

          # Fail job if both tag and release exist
          if [ "$TAG_EXISTS" = "true" ] && [ "$RELEASE_EXISTS" = "true" ]; then
            echo "Both tag and release already exist, failing job"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/

      - name: Create tag with proper error handling
        run: |
          set -euo pipefail

          PACKAGE_VERSION="${{ steps.version.outputs.version }}"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

          # Configure git for tagging
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Check if tag exists remotely (more efficient check)
          if git ls-remote --tags --refs origin "$PACKAGE_VERSION" | grep -q "refs/tags/$PACKAGE_VERSION$"; then
            echo "ℹ Tag $PACKAGE_VERSION already exists on remote, failing job"
            exit 1
          fi

          echo "Creating and pushing annotated tag $PACKAGE_VERSION..."
          git tag -a "$PACKAGE_VERSION" -m "Release $PACKAGE_VERSION"

          # Push tag with error handling
          if git push origin "$PACKAGE_VERSION"; then
            echo "✓ Tag $PACKAGE_VERSION created and pushed successfully"
          else
            echo "❌ Failed to push tag $PACKAGE_VERSION"
            exit 1
          fi

      - name: Check if release exists
        run: |
          if gh release view ${{ env.PACKAGE_VERSION }} >/dev/null 2>&1; then
            echo "Release ${{ env.PACKAGE_VERSION }} already exists, failing job"
            exit 1
          fi

      - name: Extract release notes for current version
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3.0.0
        with:
          command: query
          version: ${{ env.PACKAGE_VERSION }}
          changelog: CHANGELOG.md

      - name: Create release notes file
        run: |
          # Write release notes to file, preserving markdown formatting
          cat << 'EOF' > release_notes.md
          ${{ steps.changelog.outputs.release-notes }}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.4.1
        with:
          tag_name: ${{ env.PACKAGE_VERSION }}
          name: Release ${{ env.PACKAGE_VERSION }}
          body_path: release_notes.md
          files: dist/*
          make_latest: true
