name: CI and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.9

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Lint with ruff
        run: uv run ruff check

      - name: Build package
        run: uv build

      - name: Check build artifacts
        run: ls -la dist/

      - name: Cache dist
        uses: actions/cache@v4
        with:
          path: dist/
          key: dist-${{ github.sha }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/

  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get package version
        id: version
        run: echo "version=$(grep '^version =' pyproject.toml | sed 's/version = "\(.*\)"/\1/')" >> $GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/

      - name: Create tag with proper error handling
        run: |
          set -euo pipefail

          PACKAGE_VERSION="${{ steps.version.outputs.version }}"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

          # Configure git for tagging
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Check if tag exists remotely (more efficient check)
          if git ls-remote --tags --refs origin "$PACKAGE_VERSION" | grep -q "refs/tags/$PACKAGE_VERSION$"; then
            echo "ℹ Tag $PACKAGE_VERSION already exists on remote"
            exit 0
          fi

          echo "Creating and pushing annotated tag $PACKAGE_VERSION..."
          git tag -a "$PACKAGE_VERSION" -m "Release $PACKAGE_VERSION"

          # Push tag with error handling
          if git push origin "$PACKAGE_VERSION"; then
            echo "✓ Tag $PACKAGE_VERSION created and pushed successfully"
          else
            echo "❌ Failed to push tag $PACKAGE_VERSION"
            exit 1
          fi

      - name: Check if release exists
        run: |
          if gh release view ${{ env.PACKAGE_VERSION }} >/dev/null 2>&1; then
            echo "Release ${{ env.PACKAGE_VERSION }} already exists, skipping creation"
            echo "SKIP_RELEASE=true" >> $GITHUB_ENV
          else
            echo "SKIP_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        if: env.SKIP_RELEASE != 'true'
        uses: softprops/action-gh-release@v2.4.1
        with:
          tag_name: ${{ env.PACKAGE_VERSION }}
          name: Release ${{ env.PACKAGE_VERSION }}
          body_path: CHANGELOG.md
          files: dist/*
          make_latest: true
