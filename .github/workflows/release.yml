name: CI and Release

on:
  push:
    branches: [ stable ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -e .

      - name: Lint with ruff
        uses: astral-sh/ruff-action@v3.5.1
        with:
          args: check --select E,F --show-source --statistics

      - name: Run tests
        run: |
          python -c "import cli; print('Import successful')"
          python -c "import roll; print('Import successful')"
          python -c "import config; print('Import successful')"

      - name: Build package
        run: python -m build

      - name: Check build artifacts
        run: ls -la dist/

      - name: Cache dist
        uses: actions/cache@v4
        with:
          path: dist/
          key: dist-${{ github.sha }}

  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Get version
        run: |
          VERSION=$(grep '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if tag exists
        run: |
          if git tag -l "$VERSION" | grep -q .; then
            echo "Tag $VERSION already exists"
            exit 0
          fi

      - name: Get changelog notes
        uses: nickohold/changelog-version-extractor@v1.0.0
        id: changelog
        with:
          version: ${{ env.VERSION }}
          changelog: CHANGELOG.md

      - name: Set release notes
        run: echo "RELEASE_NOTES=${{ steps.changelog.outputs.changelog }}" >> $GITHUB_ENV

      - name: Create tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ env.VERSION }}

      - name: Create release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: ${{ env.RELEASE_NOTES }}
