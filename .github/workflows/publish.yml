name: Upload Python Package

on:
  workflow_run:
    workflows: ["CI and Release"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/automudae/${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get package version
        id: version
        run: echo "version=$(grep '^version =' pyproject.toml | sed 's/version = "\(.*\)"/\1/')" >> $GITHUB_OUTPUT

      - name: Download release assets
        run: |
          echo "Attempting to download release ${{ steps.version.outputs.version }}..."
          if gh release download ${{ steps.version.outputs.version }} --repo ${{ github.repository }} --dir dist/; then
            echo "Release downloaded successfully, proceeding with publish"
            echo "HAS_ASSETS=true" >> $GITHUB_ENV
          else
            echo "Release not found or has no assets, failing job"
            exit 1
          fi

      - name: Publish release distributions to PyPI
        if: env.HAS_ASSETS == 'true'
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          packages-dir: dist/
